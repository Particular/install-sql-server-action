name: Run SQL Server
description: Runs SQL Server using a method appropriate for the target platform
inputs:
  connection-string-env-var:
    description: Name of the output environment variable that will receive the connection string
    required: true
  catalog:
    description: Name of the initial database name (catalog) to create
    required: false
    default: nservicebus
  collation:
    description: The collation to use for the SQL Server database
    required: false
    default: "SQL_Latin1_General_CP1_CS_AS"
  sqlserver-version:
    description: The SQL server major version to use
    required: false
    default: "2022"
  extra-params:
    description: Extra parameters to add to the connection string
    required: false
  enable-full-text-search:
    description: Enable SQL Server Full-Text Search installation
    required: false
    default: "false"
  enable-distributed-transactions:
    description: Enable SQL Server distributed transactions (MSDTC) in the container
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Start SQL Server (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $enableFts  = '${{ inputs.enable-full-text-search }}' -eq 'true'
        $enableDtc  = '${{ inputs.enable-distributed-transactions }}' -eq 'true'
        $version    = '${{ inputs.sqlserver-version }}'
        $catalog    = '${{ inputs.catalog }}'
        $collation  = '${{ inputs.collation }}'
        $extraParams = '${{ inputs.extra-params }}'
        $envVarName = '${{ inputs.connection-string-env-var }}'

        # SQL Server password policy requires chars from 3 of 4 sets. A hyphenated
        # GUID (lowercase letters + digits + hyphens) satisfies this, matching the
        # `uuidgen` based password used on Linux.
        $saPassword = [guid]::NewGuid().ToString()
        Write-Output "::add-mask::$saPassword"

        $image = "mcr.microsoft.com/mssql/server:$version-latest"
        $containerName = "sqlserver"
        $port = 1433

        function Invoke-Wsl {
            param(
                [Parameter(Mandatory = $true)][string]$Distribution,
                [Parameter(Mandatory = $true)][string]$Command,
                [switch]$CheckExitCode
            )

            wsl.exe --distribution $Distribution --user root -- bash -c $Command

            if ($CheckExitCode -and $LASTEXITCODE -ne 0) {
                throw "WSL command failed with exit code $LASTEXITCODE`: $Command"
            }
        }

        if ($enableDtc) {
            # With SQL Server now running in a Linux container inside WSL, what used to be a
            # *local* DTC transaction (native SQL Express on the same host) becomes a *network*
            # transaction (host <-> WSL VM). Network DTC Access must therefore be enabled on the
            # host, and because the Linux container's MSDTC does not authenticate RPC, the host
            # must use "No Authentication Required". Without this, distributed transactions that
            # used to work via the local DTC would fail after the switch to a container.
            Write-Output "::group::Configuring host Local DTC for distributed transactions"

            $dtcService = Get-Service -Name MSDTC -ErrorAction SilentlyContinue
            if ($dtcService) {
                if ($dtcService.StartType -eq 'Disabled') {
                    Set-Service -Name MSDTC -StartupType Manual
                }
                if ($dtcService.Status -ne 'Running') {
                    Write-Output "Starting the MSDTC service"
                    Start-Service -Name MSDTC
                }
            }

            Write-Output "Enabling Network DTC Access (inbound + outbound) with No Authentication"
            # Configure Local DTC directly in the registry. Set-DtcNetworkSetting throws a
            # NullReferenceException in this headless environment (the MsDtc CIM provider is not
            # ready right after the service starts); these are the same values it would write and
            # the service is restarted below so they take effect.
            # See https://learn.microsoft.com/troubleshoot/windows/win32/new-functionality-in-msdtc-service
            $securityPath = "HKLM:\SOFTWARE\Microsoft\MSDTC\Security"
            $msdtcPath = "HKLM:\SOFTWARE\Microsoft\MSDTC"
            if (-not (Test-Path $securityPath)) { New-Item -Path $securityPath -Force | Out-Null }
            if (-not (Test-Path $msdtcPath)) { New-Item -Path $msdtcPath -Force | Out-Null }

            $networkAccess = @{
                NetworkDtcAccess             = 1
                NetworkDtcAccessAdmin        = 1
                NetworkDtcAccessClients      = 1
                NetworkDtcAccessTransactions = 1
                NetworkDtcAccessInbound      = 1
                NetworkDtcAccessOutbound     = 1
                LuTransactions               = 1
                XaTransactions               = 1
            }
            foreach ($name in $networkAccess.Keys) {
                Set-ItemProperty -Path $securityPath -Name $name -Value $networkAccess[$name] -Type DWord
            }

            # "No Authentication Required" (the container's MSDTC does not authenticate RPC).
            $noAuthentication = @{
                AllowOnlySecureRpcCalls          = 0
                FallbackToUnsecureRPCIfNecessary = 0
                TurnOffRpcSecurity               = 1
            }
            foreach ($name in $noAuthentication.Keys) {
                Set-ItemProperty -Path $msdtcPath -Name $name -Value $noAuthentication[$name] -Type DWord
            }

            Write-Output "Restarting the MSDTC service to apply the registry changes"
            Restart-Service -Name MSDTC -Force

            Write-Output "Allowing the Distributed Transaction Coordinator through Windows Firewall"
            Enable-NetFirewallRule -DisplayGroup "Distributed Transaction Coordinator"

            Write-Output "::endgroup::"
        }

        Write-Output "Running SQL Server in container $containerName inside WSL"

        $wslDistribution = $Env:WSL_DISTRIBUTION_OVERRIDE ?? "Debian"

        # Constrain the WSL2 VM (memory) and keep it from being shut down when idle, so
        # that Docker and the container are not torn down between this setup step and the
        # later test steps. Only write when the file is absent so local development
        # configurations are left untouched.
        $wslConfigPath = Join-Path $Env:USERPROFILE ".wslconfig"
        if (-not (Test-Path $wslConfigPath)) {
            $wslMemory = $Env:WSL_MEMORY_OVERRIDE ?? "4GB"
            Write-Output "Writing $wslConfigPath (memory=$wslMemory) to constrain the WSL2 VM"
            Set-Content -Path $wslConfigPath -Value "[wsl2]`nmemory=$wslMemory`nvmIdleTimeout=-1" -Encoding ASCII
        }

        Write-Output "::group::Preparing WSL ($wslDistribution)"

        wsl.exe --set-default-version 2 | Out-Null

        # Install the distribution if it is not already registered.
        $installedDistributions = ((wsl.exe --list --quiet) -replace "`0", "") |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -ne "" }

        if ($installedDistributions -notcontains $wslDistribution) {
            Write-Output "Installing $wslDistribution in WSL"
            wsl.exe --install $wslDistribution --web-download --no-launch
            if ($LASTEXITCODE -ne 0) {
                throw "Failed to install $wslDistribution in WSL"
            }
        }
        else {
            Write-Output "$wslDistribution is already installed"
        }

        # Ensure Docker is installed inside the WSL distribution.
        Write-Output "Ensuring Docker is installed inside $wslDistribution"
        Invoke-Wsl -Distribution $wslDistribution -CheckExitCode -Command "command -v docker >/dev/null 2>&1 || { apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install --yes docker.io; }"

        # Start the Docker daemon via systemd when available, otherwise via the SysV service.
        Write-Output "Starting Docker daemon inside $wslDistribution"
        Invoke-Wsl -Distribution $wslDistribution -CheckExitCode -Command "docker info >/dev/null 2>&1 || { if [ -d /run/systemd/system ]; then systemctl start docker; else service docker start; fi; }"

        # Keep the WSL instance alive for the rest of the job. WSL terminates an instance when no
        # processes remain under its init (PID 2); a plain background process (e.g. sleep) does not
        # prevent this, but a D-Bus session bus launched through `wsl --exec` does. vmIdleTimeout
        # above covers the VM-level idle timeout; this covers the separate instance-level shutdown.
        # See https://github.com/microsoft/WSL/issues/10138 and
        # https://blog.lecoteauverdoyant.co.uk/articles/wsl-keep-alive.html
        Write-Output "Starting a D-Bus session to keep the WSL instance alive for the job"
        # dbus-launch ships in the dbus-x11 package (not dbus). Verify it is present afterwards so a
        # packaging change can never silently leave the instance unguarded again.
        Invoke-Wsl -Distribution $wslDistribution -CheckExitCode -Command "command -v dbus-launch >/dev/null 2>&1 || { apt-get update && apt-get install -y dbus-x11; }; command -v dbus-launch >/dev/null 2>&1 || { echo 'dbus-launch is unavailable after installing dbus-x11' >&2; exit 1; }"
        wsl.exe --distribution $wslDistribution --user root --exec /usr/bin/dbus-launch true
        if ($LASTEXITCODE -ne 0) {
            throw "dbus-launch keep-alive failed with exit code $LASTEXITCODE"
        }

        Write-Output "::endgroup::"

        # Build the docker run arguments. Splatting an array keeps each value (incl. the SA password)
        # as a distinct argument, so no shell quoting is required when forwarding through wsl.exe.
        $dockerArgs = @(
            "run", "--name", $containerName, "--detach", "--restart", "unless-stopped",
            "--publish", "${port}:${port}",
            "-e", "ACCEPT_EULA=Y",
            "-e", "MSSQL_SA_PASSWORD=$saPassword",
            "-e", "MSSQL_PID=Developer",
            "-e", "MSSQL_COLLATION=$collation"
        )

        if ($enableDtc) {
            Write-Output "Enabling distributed transactions (MSDTC) in the container"
            # SQL Server 2019+ containers run as a non-root user and cannot bind to the privileged
            # RPC port 135, so the endpoint mapper listens on 13500 and Docker maps host 135 to it.
            # See https://learn.microsoft.com/sql/linux/containers/configure-distributed-transactions
            $dockerArgs += @(
                "-e", "MSSQL_RPC_PORT=13500",
                "-e", "MSSQL_DTC_TCP_PORT=51000",
                "--publish", "135:13500",
                "--publish", "51000:51000"
            )
        }

        if ($enableFts) {
            Write-Output "Starting SQL Server container in setup mode for Full-Text Search installation..."
            $dockerArgs += @("--entrypoint", "/bin/bash", $image, "-lc", "sleep infinity")
        }
        else {
            $dockerArgs += $image
        }

        Write-Output "::group::Starting SQL Server container"
        & wsl.exe --distribution $wslDistribution -- docker @dockerArgs
        if ($LASTEXITCODE -ne 0) {
            throw "Failed to start SQL Server container in WSL"
        }
        & wsl.exe --distribution $wslDistribution -- docker ps --filter "name=$containerName"
        Write-Output "::endgroup::"

        if ($enableFts) {
            switch ($version) {
                "2025" { $sqlEngineMajor = 17; $repoChannel = "2025" }
                "2022" { $sqlEngineMajor = 16; $repoChannel = "2022" }
                "2019" { $sqlEngineMajor = 15; $repoChannel = "2019" }
                default {
                    throw "Unsupported sqlserver-version for FTS: '$version'. Supported values: 2019, 2022, 2025."
                }
            }

            # The FTS install script is assembled from single-quoted lines and then base64-encoded
            # before being sent to the container. Encoding is essential: the script is forwarded
            # through PowerShell -> wsl.exe -> docker exec -> bash, and the WSL interop mangles the
            # embedded double quotes in the `echo "deb ..."` line, which writes a malformed apt
            # sources list and breaks `apt-get update`. Base64 carries only [A-Za-z0-9+/=], so it
            # transits every layer unchanged. __CHANNEL__/__ENGINE__ are filled in before encoding.
            $ftsLines = @(
                'set -euo pipefail'
                'rm -f /etc/apt/sources.list.d/mssql-server.list'
                'apt-get update'
                'ACCEPT_EULA=Y apt-get install -y --no-install-recommends curl gnupg'
                '. /etc/os-release'
                'curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft-prod.gpg'
                'echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/mssql-server-__CHANNEL__ ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/mssql-server.list'
                'apt-get update'
                'fts_version=$(apt-cache madison mssql-server-fts | awk ''{print $3}'' | grep -E "^__ENGINE__\." | head -n 1)'
                'if [ -z "${fts_version}" ]; then echo "No mssql-server-fts package found for SQL Server engine major __ENGINE__." >&2; exit 1; fi'
                'ACCEPT_EULA=Y apt-get install -y --no-install-recommends "mssql-server-fts=${fts_version}"'
                'apt-get clean'
                'rm -rf /var/lib/apt/lists/*'
            )
            $ftsScript = ($ftsLines -join "`n") -replace '__CHANNEL__', $repoChannel -replace '__ENGINE__', $sqlEngineMajor
            $encoded = [System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($ftsScript))

            Write-Output "::group::Installing Full-Text Search support in the SQL Server container"
            & wsl.exe --distribution $wslDistribution -- docker exec -u 0 $containerName bash -c "echo $encoded | base64 -d | bash"
            if ($LASTEXITCODE -ne 0) {
                throw "Full-Text Search installation failed"
            }

            Write-Output "Starting SQL Server process..."
            & wsl.exe --distribution $wslDistribution -- docker exec -d $containerName /opt/mssql/bin/sqlservr
            Write-Output "::endgroup::"
        }

        # Determine the WSL VM IPv4 address so that Windows can reach the published port.
        $wslIp = ((wsl.exe --distribution $wslDistribution --user root -- hostname -I) -replace "`0", "").Trim().Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries) |
            Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
            Select-Object -First 1

        if (-not $wslIp) {
            throw "Could not determine the WSL IPv4 address"
        }

        $ipAddress = $wslIp
        Write-Output "WSL address: $ipAddress"

        # The Windows runner ships a native sqlcmd (MSSQL.CMDLnUtils). Wrap it so the self-signed
        # container certificate is trusted (-C). This keeps the "bare sqlcmd" contract documented in
        # the README working from Windows too. Locate it on PATH first, then in the usual Binn folders.
        $sqlcmdExe = (Get-Command sqlcmd.exe -ErrorAction SilentlyContinue).Source
        if (-not $sqlcmdExe) {
            $sqlcmdExe = @(
                "C:\Program Files\Microsoft SQL Server\*\Tools\Binn\sqlcmd.exe",
                "C:\Program Files\Microsoft SQL Server\Client SDK\*\Tools\Binn\sqlcmd.exe"
            ) | ForEach-Object { Get-Item $_ -ErrorAction SilentlyContinue } |
                Sort-Object FullName |
                Select-Object -ExpandProperty FullName -First 1
            if (-not $sqlcmdExe) {
                throw "sqlcmd.exe was not found on the runner. Install the SQL Server Command Line Utilities (MSSQL.CMDLnUtils)."
            }
        }
        Write-Output "Using sqlcmd: $sqlcmdExe"

        $shimDir = Join-Path $Env:RUNNER_TEMP "sqlcmd-shim"
        New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
        $shimPath = Join-Path $shimDir "sqlcmd.cmd"
        Set-Content -Path $shimPath -Encoding ASCII -Value "@echo off`r`n`"$sqlcmdExe`" -C %*"
        Write-Output "Adding sqlcmd forwarding script to PATH"
        $shimDir | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

        # Make the native sqlcmd connect to the container without explicit login parameters, mirroring
        # how the in-container sqlcmd is configured on Linux.
        "SQLCMDSERVER=$ipAddress" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "SQLCMDUSER=sa" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
        "SQLCMDPASSWORD=$saPassword" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

        Write-Output "Setting environment variable $envVarName to SQL connection string..."
        "$envVarName=Server=$ipAddress;Database=$catalog;User Id=sa;Password=$saPassword;Encrypt=false;$extraParams" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
    - name: Start SQL Server (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Linux SQL install via Docker

        # If the password generator needs to be changed, make sure the resulting password meets SQL Server password requirements
        sa_pw=$(uuidgen)
        echo "::add-mask::$sa_pw"

        image="mcr.microsoft.com/mssql/server:${{ inputs.sqlserver-version }}-latest"
        base_run_args=(
          -e "ACCEPT_EULA=Y"
          -e "MSSQL_SA_PASSWORD=$sa_pw"
          -e "MSSQL_PID=Developer"
          -e "MSSQL_COLLATION=${{ inputs.collation }}"
          -e "SQLCMDSERVER=localhost"
          -e "SQLCMDUSER=sa"
          -e "SQLCMDPASSWORD=$sa_pw"
          -p 1433:1433
          --name sqlserver
          -d
        )

        if [ "${{ inputs.enable-distributed-transactions }}" = "true" ]; then
          echo "Enabling distributed transactions (MSDTC) in the container"
          # SQL Server 2019+ containers run as a non-root user and cannot bind to the privileged
          # RPC port 135, so the endpoint mapper listens on 13500 and Docker maps host 135 to it.
          # See https://learn.microsoft.com/sql/linux/containers/configure-distributed-transactions
          base_run_args+=(
            -e "MSSQL_RPC_PORT=13500"
            -e "MSSQL_DTC_TCP_PORT=51000"
            -p "135:13500"
            -p "51000:51000"
          )
        fi

        if [ "${{ inputs.enable-full-text-search }}" = "true" ]; then
          echo "Starting SQL Server container in setup mode for Full-Text Search installation..."
          docker run "${base_run_args[@]}" --entrypoint /bin/bash "$image" -lc "sleep infinity"
        else
          echo "Starting SQL Server in a Docker container..."
          docker run "${base_run_args[@]}" "$image"
        fi

        if [ "${{ inputs.enable-full-text-search }}" = "true" ]; then
          case "${{ inputs.sqlserver-version }}" in
            2025*) sql_engine_major=17; repo_channel=2025 ;;
            2022*) sql_engine_major=16; repo_channel=2022 ;;
            2019*) sql_engine_major=15; repo_channel=2019 ;;
            *)
              echo "Unsupported sqlserver-version for FTS: '${{ inputs.sqlserver-version }}'. Supported values: 2019, 2022, 2025." >&2
              exit 1
              ;;
          esac

          echo "Installing Full-Text Search support in the SQL Server container..."
          docker exec -u 0 sqlserver bash -lc "
            set -euo pipefail
            apt-get update
            ACCEPT_EULA=Y apt-get install -y --no-install-recommends curl gnupg

            . /etc/os-release
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | gpg --dearmor > /usr/share/keyrings/microsoft-prod.gpg
            echo \"deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/\${VERSION_ID}/mssql-server-${repo_channel} \${VERSION_CODENAME} main\" \
              > /etc/apt/sources.list.d/mssql-server.list

            apt-get update

            fts_version=\$(apt-cache madison mssql-server-fts \
              | awk '{print \$3}' \
              | grep -E '^${sql_engine_major}\.' \
              | head -n 1)

            if [ -z \"\${fts_version}\" ]; then
              echo \"No mssql-server-fts package found for SQL Server engine major ${sql_engine_major}.\" >&2
              exit 1
            fi

            ACCEPT_EULA=Y apt-get install -y --no-install-recommends \"mssql-server-fts=\${fts_version}\"
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          "

          echo "Starting SQL Server process..."
          docker exec -d sqlserver /opt/mssql/bin/sqlservr
        fi

        echo "Creating `sqlcmd` bash script to forward commands via docker exec"
        mkdir -p ~/bin
        cat << 'EOF' > ~/bin/sqlcmd
        #!/bin/bash
        docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -C "$@"
        EOF

        echo "Making forwarding sqlcmd script executable"
        chmod +x ~/bin/sqlcmd

        echo "Adding sqlcmd forwarding script to PATH"
        echo "$HOME/bin" >> $GITHUB_PATH

        echo "Setting environment variable ${{ inputs.connection-string-env-var }} to SQL connection string..."
        echo "${{ inputs.connection-string-env-var }}=Server=localhost;Database=${{ inputs.catalog }};User Id=sa;Password=$sa_pw;Encrypt=false;${{ inputs.extra-params }}" >> $GITHUB_ENV
    - name: Setup server
      shell: pwsh
      run: |
        # Wait for SQL Server to become available, then create the initial catalog. Both steps
        # fail loudly if SQL Server never comes up, so a slow/failed start surfaces here with a
        # clear message instead of later in consumer steps as a confusing "server not found". The
        # catalog creation is idempotent (skips if the database already exists) and retries through
        # transient failures. A freshly-started instance can deadlock on CREATE DATABASE
        # (Msg 1205, returned immediately) or block on a lock while settling (no deadlock cycle,
        # waits forever by default). A -t 30 query timeout bounds each attempt so a blocked
        # CREATE DATABASE aborts after 30s instead of hanging the job for minutes; the retry
        # then succeeds once the instance has settled.
        $enableFts = '${{ inputs.enable-full-text-search }}' -eq 'true'
        $catalog = '${{ inputs.catalog }}'

        $ready = $false
        for ($i = 1; $i -le 30; $i++) {
          Write-Output "Attempt $i/30 to connect to SQL Server..."
          sqlcmd -b -t 30 -Q "SELECT @@SERVERNAME as ServerName" 2>&1>$null
          if ($?) {
            Write-Output "  - SQL Server is now ready"
            $ready = $true
            break
          }
          Write-Output "  - Not ready, sleeping for 5s"
          Start-Sleep -seconds 5
        }
        if (-not $ready) {
          throw "SQL Server did not become ready within 150s."
        }

        if ($enableFts) {
          Write-Output "Verifying Full-Text Search availability..."
          $ftsInstalled = (sqlcmd -h -1 -W -t 30 -Q "SET NOCOUNT ON; SELECT FULLTEXTSERVICEPROPERTY('IsFullTextInstalled');").Trim()
          if ($LASTEXITCODE -ne 0 -or $ftsInstalled -ne '1') {
            throw "Full-Text Search was requested but is not available."
          }
        }

        Write-Output "Creating initial catalog '$catalog'"
        $catalogReady = $false
        for ($i = 1; $i -le 10; $i++) {
          sqlcmd -b -t 30 -Q "IF DB_ID('$catalog') IS NULL CREATE DATABASE [$catalog]" 2>&1>$null
          if ($?) { $catalogReady = $true; break }
          Write-Output "  - Catalog not yet created (attempt $i/10), sleeping for 5s"
          Start-Sleep -seconds 5
        }
        if (-not $catalogReady) {
          throw "Failed to create initial catalog '$catalog'; SQL Server may not be accepting connections."
        }
